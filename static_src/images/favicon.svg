<!-- Знак приложения Сито: сито — окружность с сеткой.

     Файл нужен только для того, что браузер показывает само, — значка во
     вкладке. В самих страницах знак нарисован кодом в разметке
     (templates/partials/sieve_mark.html): там он берёт цвет из текста и
     подстраивается под тему. Здесь цвета заданы явно, потому что вкладку
     браузер рисует на своём фоне и о теме страницы не знает.

     Геометрия та же, что в разметке: обод 1.7, сетка 1.4, хорды упираются
     в обод. Система координат — 24×24, как у иконок лаптя; поэтому файл
     годится на любой размер и не требует отдельной картинки под каждый.
     Если правишь геометрию здесь — поправь и в партиале, и наоборот.

     Фон залит наглухо (#1a1a1a — фоновый цвет Сита), без прозрачности: во
     вкладке прозрачный фон становится белым или чёрным по воле браузера, и
     знак на нём либо пропадает, либо выглядит случайно. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 24 24">
  <rect width="24" height="24" fill="#1a1a1a"/>
  <g fill="none" stroke="#c6753a" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.4" stroke-width="1.7"/>
    <g stroke-width="1.4">
      <path d="M8.2 4.51v14.98"/>
      <path d="M15.8 4.51v14.98"/>
      <path d="M4.51 8.2h14.98"/>
      <path d="M4.51 15.8h14.98"/>
    </g>
  </g>
</svg>
