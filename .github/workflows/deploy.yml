  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            echo "Deployment started..."

            cd ~/docker-nginx

            # Создаем .env файл
            cat > .env << EOL
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
            POSTGRES_DB=docsearch
            POSTGRES_USER=nextcloud
            POSTGRES_PASSWORD=1qaz!QAZ
            DB_HOST=postgres
            ELASTICSEARCH_HOST=elasticsearch
            REDIS_URL=redis://redis:6379/0
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_USE_SSL=${{ secrets.EMAIL_USE_SSL }}
            EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
            EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
            DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
            EOL

            # Скачиваем новый образ
            echo "Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/diploma:latest

            # Останавливаем старый контейнер
            echo "Stopping old container..."
            docker stop diploma-web || true
            docker rm diploma-web || true

            # Запускаем новый контейнер с .env файлом
            echo "Starting new container..."
            docker run -d \
              --name diploma-web \
              -p 8000:8000 \
              --restart unless-stopped \
              --network docker-nginx_web-network \
              --env-file .env \
              -e DB_HOST=postgres \
              -e ELASTICSEARCH_HOST=elasticsearch \
              -e REDIS_URL=redis://redis:6379/0 \
              ${{ secrets.DOCKER_USERNAME }}/diploma:latest

            # Ждем запуска
            sleep 5

            # Применяем миграции
            echo "Running migrations..."
            docker exec diploma-web python manage.py migrate --noinput || true

            # Собираем статику
            echo "Collecting static files..."
            docker exec diploma-web python manage.py collectstatic --noinput --clear || true

            # Копируем статику для Nginx
            echo "Copying static files for Nginx..."
            docker cp diploma-web:/app/static/. ./static/ || true

            # Перезапускаем Nginx
            echo "Restarting nginx..."
            docker compose restart nginx

            echo "Deployment complete!"
          EOF
