# Прод-подобная локальная раскладка Сита: всё в контейнерах, вход через nginx.
#
# ВНИМАНИЕ, ЛОВУШКА ПЕРЕХОДА (DocSearch -> Сито), имена контейнеров
# переименованы docsearch_* -> sito_*.
#
# Docker при `docker compose up -d` НЕ переименовывает работающий контейнер:
# он создаёт НОВЫЙ sito_*, а СТАРЫЙ docsearch_* остаётся жив и продолжает
# держать опубликованные порты (здесь это 80 и 443 у nginx). Итог: `up -d`
# падает на конфликте портов, а если старый контейнер не публиковал порты —
# часть запросов молча уходит в него.
#
# Поэтому порядок выкатки такой: сначала убрать старые контейнеры, потом
# поднимать новые.
#   docker rm -f docsearch_nginx docsearch_web docsearch_redis docsearch_es docsearch_db
#   docker compose up -d
# Это делает лид при выкатке — тот, кто правит конфиг, на сервере ничего не
# запускает.
#
# Второе следствие: у файла нет поля name, имя compose-проекта берётся из
# каталога. Каталог переименован (Diploma -> sito), поэтому тома теперь
# sito_postgres_data / sito_es_data / ... и создаются пустыми — данные из
# diploma_* в них не попадут. Это локальная беда: на сервере работает
# docker-compose.prod.yml, а там bind-mount'ы /srv/data/diploma и данные
# никуда не деваются.
services:
  db:
    image: postgres:15-alpine
    container_name: sito_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docsearch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: sito_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    mem_limit: 4g
    mem_reservation: 2g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sito_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: sito_web
    volumes:
      - ./static:/app/static
      - media_data:/app/media
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
      "
    expose:
      - "8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      # Имя переменной совпадает с настройками: раньше здесь стояло DEBUG, а
      # settings читал DJANGO_DEBUG, и флаг молча не применялся.
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - ELASTICSEARCH_HOST=elasticsearch
      # Номер базы Redis закреплён за проектом: на общем сервере /0 занимает
      # Самогон, /3, /4 и /5 — лапот.
      - REDIS_URL=redis://redis:6379/1
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: sito_nginx
    # Именно эти порты и создают ловушку перехода: пока жив старый
    # docsearch_nginx, он держит 80/443 и новый контейнер их не займёт.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/static:ro
      - media_data:/media:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  es_data:
  redis_data:
  media_data:
