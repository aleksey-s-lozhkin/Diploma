# Переходный редирект: docsearch.pyconstrictor.ru -> sito.pyconstrictor.ru
#
# Лежит на сервере как /srv/config/nginx/conf.d/docsearch-redirect.conf.
#
# Зачем: старое имя знают браузеры, закладки и сохранённые ссылки. Если просто
# выключить старый vhost, человек со старым адресом получит ошибку соединения
# или сервер по умолчанию. Поэтому на переходный период живут ОБА имени — и
# здесь, и в ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS / CORS_ALLOWED_ORIGINS
# (.env.production.example). Старое имя убирается отдельным шагом, когда
# владелец скажет.
#
# ВАЖНО при выкатке: в /srv/config/nginx/conf.d не должно остаться старого
# файла docsearch.pyconstrictor.ru.conf — он переименован в
# sito.pyconstrictor.ru.conf. Два блока с server_name
# docsearch.pyconstrictor.ru — это конфликт имён: nginx -t выдаст
# «conflicting server name» и может выбрать старый файл, тогда редирект молча
# не сработает, а часть запросов уйдёт в прежний vhost.
#
# Сертификат берём существующий, для старого домена: он ещё действителен, и
# выпускать для него нечего. Пока этот редирект жив, старый сертификат обязан
# продлеваться — задание certbot в crontab это умеет, потому что проверочный
# путь ниже отдаётся по HTTP напрямую, без редиректа. (Если сертификат
# перестать продлевать, HTTPS-редирект сломается ровно в день истечения.)

server {
    listen 80;
    server_name docsearch.pyconstrictor.ru;

    # ACME для продления сертификата старого домена. Обязан оставаться
    # доступным по HTTP и не редиректиться на HTTPS, иначе продление
    # сломается и наступит день, когда редирект отдаёт просроченный
    # сертификат.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — постоянный редирект на новый домен. $request_uri
    # переносит путь и строку запроса целиком, поэтому сохранённая ссылка на
    # конкретную страницу открывает ту же страницу на новом адресе.
    location / {
        return 301 https://sito.pyconstrictor.ru$request_uri;
    }
}

# Отдельный HTTPS-блок обязателен: по старому адресу ходят именно по https, и
# без него такой запрос попадёт на сервер по умолчанию
# (00-default-server.conf) — то есть на обрыв или на чужой сертификат,
# и человек увидит предупреждение браузера вместо редиректа.
server {
    listen 443 ssl;
    http2 on;

    server_name docsearch.pyconstrictor.ru;

    ssl_certificate /etc/letsencrypt/live/docsearch.pyconstrictor.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docsearch.pyconstrictor.ru/privkey.pem;

    return 301 https://sito.pyconstrictor.ru$request_uri;
}
