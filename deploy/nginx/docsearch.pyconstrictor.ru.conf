# Виртуальный хост diploma для общего nginx хоста.
#
# Лежит на сервере как /srv/config/nginx/conf.d/docsearch.pyconstrictor.ru.conf.
# Каталоги статики и медиа примонтированы в контейнер nginx как
# /srv/data/diploma/{static,media} -> /var/www/diploma/{static,media} (ro).

# ACME для продления сертификата. Обязан оставаться доступным по HTTP и не
# редиректиться на HTTPS, иначе продление сломается.
server {
    listen 80;
    server_name docsearch.pyconstrictor.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name docsearch.pyconstrictor.ru;

    ssl_certificate /etc/letsencrypt/live/docsearch.pyconstrictor.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docsearch.pyconstrictor.ru/privkey.pem;

    # Без этой строки действует дефолт nginx 1m, и любая загрузка больше
    # мегабайта получает 413 ещё до Django — в логах приложения при этом пусто.
    # Именно так и «перестало работать добавление документов».
    client_max_body_size 20m;

    location /static/ {
        alias /var/www/diploma/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/diploma/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://diploma-web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Значение фиксировано: django включает SECURE_SSL_REDIRECT и проверяет
        # именно этот заголовок, а до nginx трафик всегда доходит по HTTPS.
        proxy_set_header X-Forwarded-Proto https;

        # Загрузка и разбор документа могут занимать время: PDF на несколько
        # мегабайт плюс извлечение текста.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
