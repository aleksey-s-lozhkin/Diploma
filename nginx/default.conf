# Определение группы серверов для балансировки нагрузки
# django - это имя, web:8000 - сервис Docker Compose и порт
upstream django {
    server web:8000;
}

# Настройка HTTP сервера (прослушивает 80 порт)
server {
    listen 80;                    # Слушаем 80 порт (HTTP)
    server_name localhost;        # Доменное имя сервера
    client_max_body_size 10M;     # Максимальный размер загружаемого файла (для больших документов)

    # Эндпоинт для проверки здоровья контейнера (health check)
    location /nginx-health/ {
        access_log off;           # Не логируем эти запросы (чтобы не забивать логи)
        return 200 "healthy\n";   # Возвращаем HTTP 200 с текстом "healthy"
        add_header Content-Type text/plain;  # Устанавливаем тип ответа
    }

    # Раздача статических файлов (CSS, JS, изображения)
    location /static/ {
        alias /app/static/;       # Физический путь к статике внутри контейнера
        expires 30d;              # Кэшировать на 30 дней (браузер не будет перезапрашивать)
    }

    # Раздача загруженных пользователями файлов
    location /media/ {
        alias /app/media/;        # Физический путь к медиа-файлам
        expires 7d;               # Кэшировать на 7 дней (медиа может обновляться чаще)
    }

    # Все остальные запросы перенаправляем к Django приложению
    location / {
        proxy_pass http://django;              # Проксирование на upstream группу Django

        # Прокси-заголовки (передаём оригинальные данные от клиента)
        proxy_set_header Host $host;           # Передаём оригинальный Host
        proxy_set_header X-Real-IP $remote_addr;      # Реальный IP клиента
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Цепочка прокси
        proxy_set_header X-Forwarded-Proto $scheme;    # Протокол (http/https)

        # Таймауты соединений
        proxy_connect_timeout 60s;   # Время ожидания соединения с Django
        proxy_read_timeout 60s;      # Время ожидания ответа от Django
    }
}
