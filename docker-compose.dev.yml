# Локальная разработка: инфраструктура и приложение в контейнерах, порты
# PostgreSQL, Redis и Elasticsearch опубликованы на хост — тогда Django можно
# запускать и через runserver, подключившись к ним с localhost.
#
# Для проверки прод-подобного запуска (всё внутри, вход через nginx) есть
# docker-compose.yml. Для сервера — docker-compose.prod.yml.
services:
  db:
    image: postgres:15-alpine
    container_name: diploma-db
    environment:
      POSTGRES_DB: docsearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: diploma-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: diploma-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  web:
    build: .
    container_name: diploma-web
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --log-level debug --access-logfile -
      "
    volumes:
      - .:/app
      - ./static:/app/static
      - ./media:/app/media
      - ./logs:/app/logs
      - ./templates:/app/templates
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      # Имя переменной совпадает с настройками: раньше здесь стояло DEBUG, а
      # settings читал DJANGO_DEBUG, и флаг не применялся.
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      - POSTGRES_DB=docsearch
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - DB_HOST=db
      - ELASTICSEARCH_HOST=elasticsearch
      # /1 — база проекта; /0 на общем сервере занята Самогоном.
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 30s      # Проверять каждые 30 секунд
      timeout: 10s       # Таймаут проверки 10 секунд
      retries: 3         # 3 неудачные попытки = unhealthy
      start_period: 40s  # Дать время на запуск
    networks:
      - app_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: diploma-nginx
    ports:
      - "80:80"
    volumes:
      - ./static:/app/static:ro
      - ./media:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
  es_data:
  redis_data:

networks:
  app_network:
    driver: bridge
