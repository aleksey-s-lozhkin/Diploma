{% extends 'base.html' %}

{% block title %}Мои документы{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Мои документы</h2>
            <a href="{% url 'document_create' %}" class="btn btn-primary">+ Новый документ</a>
        </div>

        <!-- Чекбокс для показа публичных файлов -->
        <div class="card mb-3">
            <div class="card-body py-2">
                <div class="form-check form-switch">
                    <input class="form-check-input"
                           type="checkbox"
                           id="showPublicCheckbox"
                           {% if show_public %}checked{% endif %}
                           hx-get="{% url 'dashboard' %}"
                           hx-trigger="change"
                           hx-target="body"
                           hx-swap="innerHTML"
                           hx-push-url="true">
                    <label class="form-check-label" for="showPublicCheckbox">
                        🌍 Показывать публичные файлы других пользователей
                    </label>
                </div>
            </div>
        </div>

        <div id="documents-list">
            <!-- Содержимое документов -->
            {% include 'partials/documents_list.html' %}
        </div>
    </div>

    <div class="col-md-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">📊 Статистика</h5>
            </div>
            <div class="card-body">
                <p><strong>Всего документов:</strong> {{ documents|length }}</p>
                <p><strong>Всего поисков:</strong> {{ total_searches }}</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Сохраняем состояние чекбокса в URL и перезагружаем страницу
    document.getElementById('showPublicCheckbox')?.addEventListener('change', function(e) {
        const url = new URL(window.location.href);
        if (this.checked) {
            url.searchParams.set('show_public', 'true');
        } else {
            url.searchParams.delete('show_public');
        }
        window.location.href = url.toString();
    });
</script>
{% endblock %}
