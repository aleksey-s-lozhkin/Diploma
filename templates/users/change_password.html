{% extends 'base.html' %}
{% load ui %}

{% block title %}Смена пароля — поиск документов{% endblock %}

{% block content %}
<div class="auth">
    {% include 'partials/auth_aside.html' %}
    <div>

<h1>Смена пароля</h1>

<div class="card">
    <form id="change-password-form" hx-post="{% url 'change_password' %}" hx-target="#change-result" hx-swap="innerHTML">
        {% csrf_token %}

        <div class="stack">
            <div>
                <label for="old_password">Текущий пароль</label>
                <input type="password" name="old_password" id="old_password" required autocomplete="current-password">
            </div>
            <div>
                <label for="new_password1">Новый пароль</label>
                <input type="password" name="new_password1" id="new_password1" required autocomplete="new-password">
                <small class="muted">Не короче восьми символов.</small>
            </div>
            <div>
                <label for="new_password2">Подтверждение пароля</label>
                <input type="password" name="new_password2" id="new_password2" required autocomplete="new-password">
            </div>
        </div>

        <div class="actions">
            <button type="submit" style="flex:1 1 auto">
                <span class="spinner htmx-indicator" role="status" aria-label="Меняем"></span>
                Изменить пароль
            </button>
        </div>
    </form>

    <div id="change-result"></div>

    <p class="muted small" style="margin:18px 0 0">
        <a href="{% url 'dashboard' %}" hx-get="{% url 'dashboard' %}" hx-target="body" hx-swap="innerHTML" hx-push-url="true">Вернуться к документам</a>
    </p>
</div>
    </div>
</div>
{% endblock %}
