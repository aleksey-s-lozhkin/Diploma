{% extends 'base.html' %}

{% block title %}Смена пароля - Поиск документов{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">🔒 Смена пароля</h4>
            </div>
            <div class="card-body">
                <form id="change-password-form"
                      hx-post="{% url 'change_password' %}"
                      hx-target="#change-result"
                      hx-swap="innerHTML">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="old_password" class="form-label">Текущий пароль</label>
                        <input type="password"
                               name="old_password"
                               id="old_password"
                               class="form-control"
                               required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password1" class="form-label">Новый пароль</label>
                        <input type="password"
                               name="new_password1"
                               id="new_password1"
                               class="form-control"
                               required>
                        <div class="form-text text-muted small">Пароль должен содержать не менее 8 символов</div>
                    </div>
                    <div class="mb-3">
                        <label for="new_password2" class="form-label">Подтверждение пароля</label>
                        <input type="password"
                               name="new_password2"
                               id="new_password2"
                               class="form-control"
                               required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <span class="spinner-border spinner-border-sm htmx-indicator" role="status"></span>
                        Изменить пароль
                    </button>
                </form>
                <div id="change-result" class="mt-3"></div>
                <hr>
                <p class="text-center mb-0">
                    <a href="#"
                       hx-get="{% url 'dashboard' %}"
                       hx-target="body"
                       hx-swap="innerHTML"
                       hx-push-url="true">← Вернуться в личный кабинет</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
