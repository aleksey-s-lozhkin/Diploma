{% extends 'base.html' %}

{% block title %}Новый пароль - Поиск документов{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">🔑 Установка нового пароля</h4>
            </div>
            <div class="card-body">
                <p class="text-muted mb-3">
                    Введите новый пароль для вашей учётной записи.
                </p>
                <form id="password-reset-confirm-form"
                      hx-post="{% url 'password_reset_confirm' token=token %}"
                      hx-target="#confirm-result"
                      hx-swap="innerHTML">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="new_password1" class="form-label">Новый пароль</label>
                        <input type="password"
                               name="new_password1"
                               id="new_password1"
                               class="form-control"
                               required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password2" class="form-label">Подтверждение пароля</label>
                        <input type="password"
                               name="new_password2"
                               id="new_password2"
                               class="form-control"
                               required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <span class="spinner-border spinner-border-sm htmx-indicator" role="status"></span>
                        Установить пароль
                    </button>
                </form>
                <div id="confirm-result" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.success && evt.detail.pathInfo.requestPath.includes('/password-reset/')) {
            setTimeout(() => {
                htmx.ajax('GET', '/login/', {target: 'body', swap: 'innerHTML', pushUrl: true});
            }, 2000);
        }
    });
</script>
{% endblock %}
