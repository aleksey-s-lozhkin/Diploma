{% extends 'base.html' %}
{% load ui %}

{% block title %}Сброс пароля — поиск документов{% endblock %}

{% block content %}
<h1>Сброс пароля</h1>

<div class="card narrow">
    <p class="muted" style="margin-top:0">
        Введите адрес, указанный при регистрации, — отправим ссылку для установки нового пароля.
    </p>

    <form id="password-reset-form" hx-post="{% url 'password_reset_request' %}" hx-target="#reset-result" hx-swap="innerHTML">
        {% csrf_token %}
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required autocomplete="email">
        </div>

        <div class="actions">
            <button type="submit" style="flex:1 1 auto">
                <span class="spinner htmx-indicator" role="status" aria-label="Отправляем"></span>
                Отправить ссылку
            </button>
        </div>
    </form>

    <div id="reset-result"></div>

    <p class="muted small" style="margin:18px 0 0">
        <a href="{% url 'login' %}" hx-get="{% url 'login' %}" hx-target="body" hx-swap="innerHTML" hx-push-url="true">Вернуться ко входу</a>
    </p>
</div>
{% endblock %}
