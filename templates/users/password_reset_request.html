{% extends 'base.html' %}

{% block title %}Сброс пароля - Поиск документов{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">🔐 Сброс пароля</h4>
            </div>
            <div class="card-body">
                <p class="text-muted mb-3">
                    Забыли пароль? Введите свой email, и мы отправим инструкции для его восстановления.
                </p>
                <form id="password-reset-form"
                      hx-post="{% url 'password_reset_request' %}"
                      hx-target="#reset-result"
                      hx-swap="innerHTML">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email"
                               name="email"
                               id="email"
                               class="form-control"
                               required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">
                        <span class="spinner-border spinner-border-sm htmx-indicator" role="status"></span>
                        Отправить инструкции
                    </button>
                </form>
                <div id="reset-result" class="mt-3"></div>
                <hr>
                <p class="text-center mb-0">
                    <a href="#"
                       hx-get="{% url 'login' %}"
                       hx-target="body"
                       hx-swap="innerHTML"
                       hx-push-url="true">Вернуться ко входу</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
