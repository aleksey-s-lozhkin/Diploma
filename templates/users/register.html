{% extends 'base.html' %}

{% block title %}Регистрация - Поиск документов{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">📝 Регистрация</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>  <!-- ИЗМЕНИТЬ -->
                        <input type="email" name="email" id="email" class="form-control" required autofocus>  <!-- ИЗМЕНИТЬ -->
                    </div>
                    <div class="mb-3">
                        <label for="password1" class="form-label">Пароль</label>
                        <input type="password" name="password1" id="password1" class="form-control" required>
                        <div class="form-text text-muted small">Пароль должен содержать не менее 8 символов</div>
                    </div>
                    <div class="mb-3">
                        <label for="password2" class="form-label">Подтверждение пароля</label>
                        <input type="password" name="password2" id="password2" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                </form>
                <hr>
                <p class="text-center mb-0">
                    Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
