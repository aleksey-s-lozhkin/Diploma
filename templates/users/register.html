{% extends 'base.html' %}
{% load ui %}

{% block title %}Регистрация — поиск документов{% endblock %}

{% block content %}
<div class="auth">
    {% include 'partials/auth_aside.html' %}
    <div>

<h1>Регистрация</h1>

<div class="card">
    {% include 'users/register_form.html' %}
</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // После успешной регистрации сервер отвечает редиректом на вход; при
    // отправке через htmx переход делает эта проверка.
    document.body.addEventListener('htmx:afterRequest', function (evt) {
        if (evt.detail.success && evt.detail.pathInfo.requestPath === '/register/') {
            setTimeout(function () {
                htmx.ajax('GET', '{% url "login" %}', { target: 'body', swap: 'innerHTML', pushUrl: true });
            }, 1500);
        }
    });
</script>
{% endblock %}
