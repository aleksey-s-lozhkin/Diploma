{% extends 'base.html' %}

{% block title %}Регистрация - Поиск документов{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">📝 Регистрация</h4>
            </div>
            <div class="card-body">
                {% include 'users/register_form.html' %}
                <hr>
                <p class="text-center mb-0">
                    Уже есть аккаунт?
                    <a href="#" hx-get="{% url 'login' %}" hx-target="body" hx-swap="innerHTML" hx-push-url="true">Войти</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.success && evt.detail.pathInfo.requestPath === '/register/') {
            setTimeout(() => {
                htmx.ajax('GET', '/login/', {target: 'body', swap: 'innerHTML', pushUrl: true});
            }, 1500);
        }
    });
</script>
{% endblock %}
