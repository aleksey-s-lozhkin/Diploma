{% extends 'base.html' %}

{% block title %}Главная - Поиск документов{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1 class="text-center mb-4">🔍 Поиск документов</h1>

        <div class="card shadow">
            <div class="card-body">

                {% if user.is_authenticated %}
                <!-- CSRF токен для HTMX -->
                <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

                <!-- Поисковая строка -->
                <div class="mb-3">
                    <input type="text"
                           class="form-control form-control-lg"
                           name="query"
                           placeholder="Введите поисковый запрос..."
                           hx-post="{% url 'search_results' %}"
                           hx-trigger="keyup changed delay:300ms"
                           hx-target="#search-results"
                           hx-indicator="#spinner"
                           autocomplete="off">
                    <div id="spinner" class="htmx-indicator text-center mt-2">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>

                <!-- Фильтр по публичности -->
                <div class="mb-3">
                    <label class="form-label fw-bold">🔒 Тип доступа:</label>
                    <select name="privacy"
                            class="form-select"
                            hx-post="{% url 'search_results' %}"
                            hx-trigger="change"
                            hx-target="#search-results"
                            hx-include="[name='query']">
                        <option value="all">Все документы</option>
                        <option value="public">🌍 Только публичные</option>
                        <option value="private">🔒 Только мои</option>
                    </select>
                </div>

                {% else %}
                <div class="alert alert-warning text-center">
                    🔐 Для использования поиска
                    <a href="{% url 'login' %}" class="alert-link">войдите в систему</a> или
                    <a href="{% url 'register' %}" class="alert-link">зарегистрируйтесь</a>.
                </div>
                {% endif %}

            </div>
        </div>

        <!-- Результаты поиска -->
        <div id="search-results" class="mt-4">
            <div class="alert alert-info">Введите запрос для поиска</div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const searchQuery = urlParams.get('search');
        if (searchQuery) {
            const searchInput = document.querySelector('input[name="query"]');
            if (searchInput) {
                searchInput.value = searchQuery;
                searchInput.dispatchEvent(new Event('keyup'));
            }
        }
    });
</script>
{% endblock %}
